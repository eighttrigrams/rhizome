<!-- spellcheck is inherited, so once here is once for every field and every
     editing surface in the app. Nothing in rhizome wants a red or blue underline
     under what you type: these are titles, tags, ids and search terms, and the
     browser's opinion of them is wrong more often than not. -->
<body spellcheck="false">
<div id="app"/>
<script src="/js/main.js"></script>
</body>
</html>
